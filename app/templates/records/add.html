{% extends "base.html" %}

{% block title %}新增健康记录{% endblock %}

{% block content %}
<h2 class="mb-4">新增健康记录</h2>

<div class="row">
    <div class="col-md-6">
        <form method="post">
            <div class="mb-3">
                <label class="form-label">记录日期</label>
                <input type="date" name="record_date" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">收缩压(高压)</label>
                <input type="number" name="systolic_bp" min="0" max="300" class="form-control" placeholder="单位 mmHg,如 120">
            </div>
            <div class="mb-3">
                <label class="form-label">舒张压(低压)</label>
                <input type="number" name="diastolic_bp" min="0" max="200" class="form-control" placeholder="单位 mmHg,如 80">
            </div>
            <div class="mb-3">
                <label class="form-label">血糖</label>
                <input type="number" step="0.1" name="blood_glucose" min="0" max="50" class="form-control" placeholder="单位 mmol/L,如 5.6">
            </div>
            <div class="mb-3">
                <label class="form-label">心率</label>
                <input type="number" name="heart_rate" min="0" max="300" class="form-control" placeholder="单位 次/分,如 72">
            </div>
            <div class="mb-3">
                <label class="form-label">体重(kg)</label>
                <input type="number" step="0.1" name="weight" min="0" max="500" class="form-control" placeholder="如 65.5">
            </div>
            <div class="mb-3">
                <label class="form-label">备注</label>
                <input type="text" name="note" class="form-control" placeholder="选填">
            </div>
            <button type="submit" class="btn btn-primary">保存</button>
            <a href="{{ url_for('records.list_records') }}" class="btn btn-secondary">返回列表</a>
        </form>
    </div>
</div>
{% endblock %}
